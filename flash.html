<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Lightning Simulation</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: #05070b;
  color: #ddd;
  font-family: Menlo, Monaco, Consolas, monospace;
}

body {
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

#app {
  display: flex;
  gap: 18px;
  padding: 20px;
}

canvas {
  width: 600px;
  height: 840px;
  background: #050711;
  border: 1px solid #252a38;
}

#panel {
  width: 225px;
  padding-top: 2px;
  font-size: 13px;
}

h3 {
  margin: 0 0 20px 0;
  color: #e4e7ff;
}

.row {
  margin-bottom: 8px;
}

.value {
  color: #aab3ff;
}

input[type="range"] {
  width: 100%;
  margin-bottom: 16px;
}

button {
  display: block;
  width: 100%;
  height: 40px;
  margin-bottom: 10px;
  color: #fff;
  background: #171b29;
  border: 1px solid #3c435d;
  cursor: pointer;
}

button:hover {
  background: #21273a;
}

#status {
  line-height: 1.6;
  margin-top: 16px;
  color: #bbb;
}
</style>
</head>

<body>

<div id="app">

  <canvas id="canvas" width="600" height="840"></canvas>

  <div id="panel">

    <h3>LIGHTNING</h3>

    <div class="row">
      Field Bias:
      <span class="value" id="etaValue">2.20</span>
    </div>

    <input
      id="eta"
      type="range"
      min="0.5"
      max="5"
      step="0.05"
      value="2.2"
    />

    <button id="start">START</button>
    <button id="reset">RESET</button>

    <div id="status">Ready</div>

  </div>

</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const CW = canvas.width;
const CH = canvas.height;

const GW = 150;
const GH = 210;
const N = GW * GH;

const CELL_W = CW / GW;
const CELL_H = CH / GH;

let phiA = new Float32Array(N);
let phiB = new Float32Array(N);

let state = new Uint8Array(N);
let parent = new Int32Array(N);

let px = new Float32Array(N);
let py = new Float32Array(N);

let nodes = [];
let frontier = new Set();

let seedIndex = -1;
let groundNode = -1;

let running = false;
let finished = false;

let ETA = 2.2;

let flashPower = 0;
let boltAlpha = 1;

function indexOf(x, y) {
  return y * GW + x;
}

function getX(i) {
  return i % GW;
}

function getY(i) {
  return Math.floor(i / GW);
}

function clamp(v, a, b) {
  return Math.max(a, Math.min(b, v));
}

function smoothstep(a, b, x) {
  let t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
}

function reset() {

  running = false;
  finished = false;

  flashPower = 0;
  boltAlpha = 1;

  frontier.clear();
  nodes.length = 0;

  state.fill(0);
  parent.fill(-1);

  px.fill(0);
  py.fill(0);

  groundNode = -1;

  for (let y = 0; y < GH; y++) {

    const v = y / (GH - 1);

    for (let x = 0; x < GW; x++) {

      const i = indexOf(x, y);

      phiA[i] = v;
      phiB[i] = v;
    }
  }

  for (let x = 0; x < GW; x++) {

    const i = indexOf(x, GH - 1);

    state[i] = 2;

    phiA[i] = 1;
    phiB[i] = 1;
  }

  const sx = Math.floor(GW * 0.5);
  const sy = 2;

  seedIndex = indexOf(sx, sy);

  state[seedIndex] = 1;

  phiA[seedIndex] = 0;
  phiB[seedIndex] = 0;

  px[seedIndex] = (sx + 0.5) * CELL_W;
  py[seedIndex] = (sy + 0.5) * CELL_H;

  nodes.push(seedIndex);

  addFrontierAround(seedIndex);

  relaxPotential(60);

  document.getElementById("status").textContent = "Ready";

  draw();
}

function addFrontierAround(i) {

  const x = getX(i);
  const y = getY(i);

  for (let oy = -1; oy <= 1; oy++) {

    for (let ox = -1; ox <= 1; ox++) {

      if (ox === 0 && oy === 0) {
        continue;
      }

      const nx = x + ox;
      const ny = y + oy;

      if (
        nx < 0 ||
        nx >= GW ||
        ny < 1 ||
        ny >= GH - 1
      ) {
        continue;
      }

      const ni = indexOf(nx, ny);

      if (state[ni] === 0) {
        frontier.add(ni);
      }
    }
  }
}

function relaxPotential(iterations = 10) {

  for (let iteration = 0; iteration < iterations; iteration++) {

    for (let y = 1; y < GH - 1; y++) {

      for (let x = 1; x < GW - 1; x++) {

        const i = indexOf(x, y);

        if (state[i] === 1) {

          phiB[i] = 0;

          continue;
        }

        phiB[i] =
          (
            phiA[indexOf(x - 1, y)] +
            phiA[indexOf(x + 1, y)] +
            phiA[indexOf(x, y - 1)] +
            phiA[indexOf(x, y + 1)]
          ) * 0.25;
      }
    }

    for (let x = 0; x < GW; x++) {
      phiB[indexOf(x, 0)] = 0;
    }

    for (let x = 0; x < GW; x++) {
      phiB[indexOf(x, GH - 1)] = 1;
    }

    for (let y = 1; y < GH - 1; y++) {

      phiB[indexOf(0, y)] =
        phiB[indexOf(1, y)];

      phiB[indexOf(GW - 1, y)] =
        phiB[indexOf(GW - 2, y)];
    }

    for (let n = 0; n < nodes.length; n++) {
      phiB[nodes[n]] = 0;
    }

    const temp = phiA;
    phiA = phiB;
    phiB = temp;
  }
}

function candidateWeight(i) {

  const x = getX(i);
  const y = getY(i);

  const potential =
    Math.max(phiA[i], 0.000001);

  let weight =
    Math.pow(potential, ETA);

  const edgeDistance =
    Math.min(
      x,
      GW - 1 - x
    );

  const safeMargin = 14;

  let edgeFactor =
    smoothstep(
      2,
      safeMargin,
      edgeDistance
    );

  edgeFactor *= edgeFactor;

  weight *= edgeFactor;

  const depth =
    y / (GH - 1);

  weight *=
    0.75 +
    depth * 0.35;

  let neighborChannels = 0;

  for (let oy = -1; oy <= 1; oy++) {

    for (let ox = -1; ox <= 1; ox++) {

      if (ox === 0 && oy === 0) {
        continue;
      }

      const nx = x + ox;
      const ny = y + oy;

      if (
        nx < 0 ||
        nx >= GW ||
        ny < 0 ||
        ny >= GH
      ) {
        continue;
      }

      const ni =
        indexOf(nx, ny);

      if (state[ni] === 1) {
        neighborChannels++;
      }
    }
  }

  if (neighborChannels >= 3) {
    weight *= 0.08;
  }
  else if (neighborChannels === 2) {
    weight *= 0.35;
  }

  return weight;
}

function chooseCandidate() {

  if (frontier.size === 0) {
    return -1;
  }

  let total = 0;

  for (const i of frontier) {
    total += candidateWeight(i);
  }

  if (total <= 0) {

    let best = -1;
    let bestPhi = -Infinity;

    for (const i of frontier) {

      if (phiA[i] > bestPhi) {

        bestPhi = phiA[i];
        best = i;
      }
    }

    return best;
  }

  let r =
    Math.random() *
    total;

  for (const i of frontier) {

    r -= candidateWeight(i);

    if (r <= 0) {
      return i;
    }
  }

  return frontier.values().next().value;
}

function chooseParent(i) {

  const x = getX(i);
  const y = getY(i);

  let bestParent = -1;
  let bestScore = -Infinity;

  for (let oy = -1; oy <= 1; oy++) {

    for (let ox = -1; ox <= 1; ox++) {

      if (ox === 0 && oy === 0) {
        continue;
      }

      const nx = x + ox;
      const ny = y + oy;

      if (
        nx < 0 ||
        nx >= GW ||
        ny < 0 ||
        ny >= GH
      ) {
        continue;
      }

      const p =
        indexOf(nx, ny);

      if (state[p] !== 1) {
        continue;
      }

      let score =
        Math.random() * 0.15;

      const dy =
        y - ny;

      score +=
        dy * 0.35;

      const gp =
        parent[p];

      if (gp >= 0) {

        const gx = getX(gp);
        const gy = getY(gp);

        let ax = nx - gx;
        let ay = ny - gy;

        let bx = x - nx;
        let by = y - ny;

        const al =
          Math.hypot(ax, ay);

        const bl =
          Math.hypot(bx, by);

        if (al > 0 && bl > 0) {

          ax /= al;
          ay /= al;

          bx /= bl;
          by /= bl;

          const dot =
            ax * bx +
            ay * by;

          score +=
            dot * 0.75;
        }
      }

      if (score > bestScore) {

        bestScore =
          score;

        bestParent =
          p;
      }
    }
  }

  return bestParent;
}

function createVisualPoint(i, p) {

  const x = getX(i);
  const y = getY(i);

  const cx =
    (x + 0.5) *
    CELL_W;

  const cy =
    (y + 0.5) *
    CELL_H;

  if (p < 0) {

    px[i] = cx;
    py[i] = cy;

    return;
  }

  const pcx = px[p];
  const pcy = py[p];

  let dx =
    cx - pcx;

  let dy =
    cy - pcy;

  let len =
    Math.hypot(dx, dy);

  if (len < 0.001) {

    dx = 0;
    dy = 1;
    len = 1;
  }

  dx /= len;
  dy /= len;

  const nx = -dy;
  const ny = dx;

  const perpendicularNoise =
    (Math.random() - 0.5) *
    CELL_W *
    0.72;

  const alongNoise =
    (Math.random() - 0.5) *
    CELL_W *
    0.18;

  let vx =
    cx +
    nx * perpendicularNoise +
    dx * alongNoise;

  let vy =
    cy +
    ny * perpendicularNoise +
    dy * alongNoise;

  const gp =
    parent[p];

  if (gp >= 0) {

    let oldDX =
      px[p] - px[gp];

    let oldDY =
      py[p] - py[gp];

    const oldLen =
      Math.hypot(
        oldDX,
        oldDY
      );

    if (oldLen > 0.001) {

      oldDX /= oldLen;
      oldDY /= oldLen;

      const desired =
        Math.hypot(
          CELL_W,
          CELL_H
        ) * 0.72;

      const projectedX =
        px[p] +
        oldDX * desired;

      const projectedY =
        py[p] +
        oldDY * desired;

      vx =
        vx * 0.78 +
        projectedX * 0.22;

      vy =
        vy * 0.78 +
        projectedY * 0.22;
    }
  }

  const margin = 9;

  vx =
    clamp(
      vx,
      margin,
      CW - margin
    );

  vy =
    clamp(
      vy,
      0,
      CH - 4
    );

  px[i] = vx;
  py[i] = vy;
}

function growOne() {

  relaxPotential(9);

  const i =
    chooseCandidate();

  if (i < 0) {

    running = false;

    document
      .getElementById("status")
      .textContent =
      "No candidates";

    return;
  }

  const p =
    chooseParent(i);

  if (p < 0) {

    frontier.delete(i);

    return;
  }

  frontier.delete(i);

  state[i] = 1;
  parent[i] = p;

  phiA[i] = 0;
  phiB[i] = 0;

  createVisualPoint(i, p);

  nodes.push(i);

  addFrontierAround(i);

  const y =
    getY(i);

  if (y >= GH - 2) {

    groundNode = i;

    finished = true;
    running = false;

    flashPower = 1;
    boltAlpha = 1;

    document
      .getElementById("status")
      .textContent =
      "Ground reached";
  }
}

function beginSegmentPath() {

  ctx.beginPath();

  for (let n = 1; n < nodes.length; n++) {

    const i =
      nodes[n];

    const p =
      parent[i];

    if (p < 0) {
      continue;
    }

    ctx.moveTo(
      px[p],
      py[p]
    );

    ctx.lineTo(
      px[i],
      py[i]
    );
  }
}

function drawBranches() {

  ctx.save();

  ctx.globalCompositeOperation =
    "lighter";

  beginSegmentPath();

  ctx.lineWidth = 13;

  ctx.strokeStyle =
    "rgba(95,115,255,0.025)";

  ctx.stroke();

  beginSegmentPath();

  ctx.lineWidth = 7;

  ctx.strokeStyle =
    "rgba(115,135,255,0.06)";

  ctx.stroke();

  beginSegmentPath();

  ctx.lineWidth = 3;

  ctx.strokeStyle =
    "rgba(155,170,255,0.20)";

  ctx.stroke();

  beginSegmentPath();

  ctx.lineWidth = 0.8;

  ctx.strokeStyle =
    "rgba(220,225,255,0.90)";

  ctx.stroke();

  ctx.restore();
}

function getMainPath() {

  const path = [];

  if (groundNode < 0) {
    return path;
  }

  let i =
    groundNode;

  while (i >= 0) {

    path.push(i);

    if (i === seedIndex) {
      break;
    }

    i =
      parent[i];
  }

  path.reverse();

  return path;
}

function drawMainChannel() {

  const path =
    getMainPath();

  if (path.length < 2) {
    return;
  }

  ctx.save();

  ctx.globalCompositeOperation =
    "lighter";

  ctx.beginPath();

  ctx.moveTo(
    px[path[0]],
    py[path[0]]
  );

  for (let n = 1; n < path.length; n++) {

    ctx.lineTo(
      px[path[n]],
      py[path[n]]
    );
  }

  ctx.lineWidth = 20;

  ctx.strokeStyle =
    "rgba(110,125,255,0.035)";

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(
    px[path[0]],
    py[path[0]]
  );

  for (let n = 1; n < path.length; n++) {

    ctx.lineTo(
      px[path[n]],
      py[path[n]]
    );
  }

  ctx.lineWidth = 9;

  ctx.strokeStyle =
    "rgba(145,160,255,0.12)";

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(
    px[path[0]],
    py[path[0]]
  );

  for (let n = 1; n < path.length; n++) {

    ctx.lineTo(
      px[path[n]],
      py[path[n]]
    );
  }

  ctx.lineWidth = 3.4;

  ctx.strokeStyle =
    "rgba(195,205,255,0.70)";

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(
    px[path[0]],
    py[path[0]]
  );

  for (let n = 1; n < path.length; n++) {

    ctx.lineTo(
      px[path[n]],
      py[path[n]]
    );
  }

  ctx.lineWidth = 1.25;

  ctx.strokeStyle =
    "rgba(255,255,255,1)";

  ctx.stroke();

  ctx.restore();
}

function drawBackground() {

  const gradient =
    ctx.createLinearGradient(
      0,
      0,
      0,
      CH
    );

  gradient.addColorStop(
    0,
    "#04050b"
  );

  gradient.addColorStop(
    0.55,
    "#050611"
  );

  gradient.addColorStop(
    1,
    "#070815"
  );

  ctx.fillStyle =
    gradient;

  ctx.fillRect(
    0,
    0,
    CW,
    CH
  );

  const groundGradient =
    ctx.createLinearGradient(
      0,
      CH - 80,
      0,
      CH
    );

  groundGradient.addColorStop(
    0,
    "rgba(80,90,150,0)"
  );

  groundGradient.addColorStop(
    1,
    "rgba(80,90,150,0.08)"
  );

  ctx.fillStyle =
    groundGradient;

  ctx.fillRect(
    0,
    CH - 80,
    CW,
    80
  );

  ctx.beginPath();

  ctx.moveTo(
    0,
    CH - 3
  );

  ctx.lineTo(
    CW,
    CH - 3
  );

  ctx.lineWidth = 1;

  ctx.strokeStyle =
    "rgba(145,155,200,0.20)";

  ctx.stroke();
}

function drawFlash() {

  if (flashPower <= 0.001) {
    return;
  }

  ctx.save();

  ctx.globalCompositeOperation =
    "lighter";

  ctx.fillStyle =
    `rgba(120,135,255,${flashPower * 0.10})`;

  ctx.fillRect(
    0,
    0,
    CW,
    CH
  );

  ctx.restore();
}

function draw() {

  drawBackground();

  if (boltAlpha > 0.001) {

    ctx.save();

    ctx.globalAlpha =
      boltAlpha;

    drawBranches();

    if (groundNode >= 0) {
      drawMainChannel();
    }

    ctx.restore();
  }

  drawFlash();
}

function animate() {

  if (
    running &&
    !finished
  ) {

    const growthPerFrame = 2;

    for (let n = 0; n < growthPerFrame; n++) {

      if (
        !running ||
        finished
      ) {
        break;
      }

      growOne();
    }
  }

  if (flashPower > 0) {

    flashPower *= 0.82;

    if (flashPower < 0.002) {
      flashPower = 0;
    }
  }

  if (
    finished &&
    flashPower < 0.35
  ) {

    boltAlpha *= 0.91;

    if (boltAlpha < 0.003) {

      boltAlpha = 0;

      document
        .getElementById("status")
        .textContent =
        "Discharged";
    }
  }

  draw();

  requestAnimationFrame(
    animate
  );
}

const etaSlider =
  document.getElementById("eta");

const etaValue =
  document.getElementById("etaValue");

etaSlider.addEventListener(
  "input",
  () => {

    ETA =
      Number(
        etaSlider.value
      );

    etaValue.textContent =
      ETA.toFixed(2);
  }
);

document
  .getElementById("start")
  .addEventListener(
    "click",
    () => {

      if (finished) {
        reset();
      }

      running = true;

      document
        .getElementById("status")
        .textContent =
        "Growing";
    }
  );

document
  .getElementById("reset")
  .addEventListener(
    "click",
    reset
  );

reset();
animate();

</script>

</body>
</html>
